name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/build.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "CNAME"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # /var/log/deploy.log shows real commit history, which a depth-1 clone
          # would flatten to a single entry.
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # The browser reads the calendar live through the Calendar API, so this is not
      # a sync: it refreshes the snapshot that ships as the fallback. That matters
      # for anyone whose browser strips Referer, since the API answers 403 without
      # one, and for local development, where localhost is not on the allow list.
      #
      # public/calendar.json stays committed so a failed refresh still leaves a real
      # snapshot rather than nothing. The daily cron that used to commit it is gone;
      # nothing writes to the repository from CI any more.
      # Google being briefly unreachable is no reason to block a deploy.
      - name: Refresh calendar snapshot
        run: node scripts/fetch-calendar.mjs
        continue-on-error: true

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
